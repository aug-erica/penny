# Card last-4 -> cardholder. Used by CSV/feed adapters that carry only the card
# number (statements carry the name inline). From the Chase Employees list.
# Rolling ("continuous") close: Penny polls QBO for newly-posted card charges for
# these cardholders, categorizes + books each on the spot, and DMs them to
# confirm + collect a receipt — a steady drip instead of a month-end burst.
# FULL TEAM (rolled out July 13, 2026 — was Erica+Purvi prototype). Every real
# cardholder is enrolled, plus the "Finance / AP Card" whose drip DMs route to
# Natalie (its owner-of-record; see her slack_users mapping above).
# A cardholder only gets a drip DM if they're in bot.slack_users above.
continuous_close:
  cardholders:
    - "Erica Seldin"
    - "Purvi Patel"
    - "Mike Arauz"
    - "Alexis Black"
    - "Samantha Lozzi"
    - "Levi Baer"
    - "Michael Burkin"
