card_feed:
  type: chase_statement_pdf   # interim: chase_activity_csv via --card-csv until QBO feed is live
  account_last4: "8303"
  # For the future qbo_feed adapter. Main CC account in QBO:
  #   "2180 Chase Business Card (8303)", Account Id 298.
  # Sub-cards have their own ids (e.g. 2184); enumerate all via
  #   SELECT * FROM Account WHERE AccountType='CreditCard' — don't hardcode.
  # NOTE: as of 2026-07-01 the Chase card is NOT bank-fed to QBO — charges arrive
  # via Expensify at month-close (register stops at 5/29, all "Credit Card Misc").
  # qbo_feed needs Skyfin to connect the card as a direct bank feed AND cut over
  # from the Expensify->QBO push (else duplicates).
  qbo_account_ref: "298"
  # Month folders are MMYY; statement covering the tail of month M lives in folder M+1.
  month_folder_format: "%m%y"
  statement_glob: "Bank & CC Statements and Recs/*8303*Statement*.pdf"
  rec_report_glob: "Bank & CC Statements and Recs/*8303*Rec*Report*.pdf"

receipt_vault:
  type: expensify
  # Date filters on the Expensify API apply to report submission date, not expense
  # date — fetch this many days of padding either side of the close month and
  # filter by expense date in code.
  window_pad_days_before: 45
  window_pad_days_after: 0   # 0 = through run date
  report_states: ["APPROVED", "REIMBURSED", "ARCHIVED"]
  shadow_report_states: ["SUBMITTED", "APPROVED", "REIMBURSED", "ARCHIVED"]

books_out:
  type: csv_stub   # Phase 1: nothing is ever posted

matching:
  date_window_days: 3
  merchant_fuzz_threshold: 80

billable:
  # Billable T&E is always flagged for review regardless of confidence:
  # it hits client invoices and the ~10% T&E cap per SOW.
  always_flag: true
  billable_categories: ["Billable Expense"]
  # Billable expenses tag to a specific PROJECT (not just a client), because
  # only project-tagged spend gets included/re-billed. The valid list = Closed
  # Won HubSpot deals whose service window overlaps the close month (Option A —
  # HubSpot is the upstream source of the dashboard's Confirmed Revenue tab and
  # is fully automatable). Refreshed each close into active_projects.yaml; the
  # pull logic + the "closedwon"-stage gotcha live in
  # adapters/projects/hubspot_projects.py. Headless refresh needs HUBSPOT_TOKEN.
  billable_projects_file: "active_projects.yaml"

# Billable-customer resolution to QuickBooks. QBO is parent (client) -> sub-customer
# (project). HubSpot names drift from QBO, and clients are sometimes an acronym in
# HubSpot but the legal name in QBO — map those here so Penny pins the right PARENT
# before matching/creating the sub-customer. (Add entries as they come up.)
qbo:
  parent_aliases:
    PPFA: "Planned Parenthood Federation of America"
    ACLU: "American Civil Liberties Union"

# Employee out-of-pocket REIMBURSEMENTS (moving off Expensify). A pal just DMs
# Penny about an expense they paid for ("$42 client lunch" + a receipt) — the
# "reimburse" trigger word is OPTIONAL now: because Penny initiates all card-charge
# conversations itself, a pal-INITIATED top-level DM defaults to a reimbursement
# (see engine/intent.py; ambiguous messages get a one-line clarifier). Penny logs
# it, Purvi approves it in the dashboard queue, and Penny produces a copy-paste
# Justworks payout summary a human enters in Justworks.
# v1 = a 3-person pilot, parallel to Expensify. Gated by `participants` (mirrors
# continuous_close.cardholders).
reimbursements:
  enabled: true
  trigger: "reimburse"                   # OPTIONAL explicit override now — a pal-initiated
                                         # top-level DM defaults to a reimbursement without
                                         # it (intent-routed; see engine/intent.py)
  receipt_required: true                 # require a receipt only at/above the threshold
  receipt_threshold_cents: 10000         # receipts required only for $100+ (matches the
                                         # card side); under $100 no receipt is asked
  category_required: false               # Penny PROPOSES the category (like it does for
                                         # card spend) — the employee never has to recall
                                         # or type a category name. A low-confidence guess
                                         # is flagged for the reviewer, never bounced back
                                         # to the submitter. (Reviewer still confirms in the
                                         # dashboard; Skyfin books off the approved category.)
  open_to_all: true                      # OPEN TO THE WHOLE TEAM (July 24, 2026) — any
                                         # mapped teammate (bot.slack_users) can submit.
                                         # `participants` below is now just the original
                                         # pilot record, ignored while open_to_all is on.
  participants:                          # (superseded by open_to_all)
    - "Erica Seldin"
    - "Purvi Patel"
    - "Keara Mascareñas"                 # August's reimbursement beta tester / power user
  approver:
    primary: "Purvi Patel"              # falls back to reviewer.primary
    secondary: "Erica Seldin"           # approves Purvi's own submissions (no self-approval)
  # Employee -> Justworks identity. work_email is the key the Justworks bulk-upload
  # template matches on; member_id is from list_members (future automation).
  justworks_members:
    "Erica Seldin": {work_email: "erica@aug.co", member_id: "member_019x65xyh85gab0gkfys615apb"}
    "Purvi Patel": {work_email: "purvi@aug.co", member_id: "member_01k83xmm2fz7n3rwy4ytcw2m8f"}
    "Keara Mascareñas": {work_email: "keara@aug.co", member_id: "member_01ehdcjx0ge98jj7c9w91zn1p3"}
    "Mike Arauz": {work_email: "mike@aug.co"}
    "Alexis Black": {work_email: "alexis@aug.co"}
    "Samantha Lozzi": {work_email: "sam@aug.co"}
    "Levi Baer": {work_email: "levi@aug.co"}
    "Michael Burkin": {work_email: "michaelb@aug.co"}
    "Tirzah Enumah": {work_email: "tirzah@aug.co"}
    "Karina Mangu-Ward": {work_email: "karina@aug.co"}
    "Jessie Punia": {work_email: "jessie@aug.co"}
    "Melissa Shamis": {work_email: "melissa@aug.co"}
  payment:
    type: "justworks_manual"            # manual for v1: Penny prepares, a human pays in Justworks
  # QBO booking (Natalie/Skyfin, final structure July 2026): on APPROVAL Penny
  # creates a Bill (vendor = employee) with the expense line coded to the ACTUAL
  # category GL and the normal A/P as payable  -> DR category / CR A/P (proper P&L
  # categorization). When Purvi exports the Justworks batch, Penny pays the Bill
  # from the 1345 Employee Reimbursement Clearing credit-card account
  # -> DR A/P / CR 1345.
  # Justworks also posts the reimbursement to 1345, so the two offset and 1345 nets
  # to ~zero (no double-count). employee -> exact QBO Vendor DisplayName (varies;
  # do not fuzzy). The QBO Bill Payment uses PayType=CreditCard, so account 1345
  # must remain a Credit Card-type account in QBO (Natalie's requested setup).
  qbo:
    ap_account_id: "59"                       # Accounts Payable (A/P) 2000 — Bill payable side
    reimbursement_clearing_account_id: "231"  # 1345 Employee Reimbursement Clearing — bill-payment offset
    vendors:
      "Erica Seldin": "erica@aug.co"
      "Mike Arauz": "Mike Arauz"
      "Jessie Punia": "Jessie Punia"
      "Alexis Black": "Alexis Gonzales-Black"
      "Karina Mangu-Ward": "Karina Mangu-Ward"
      "Tirzah Enumah": "tirzah@aug.co"
      "Levi Baer": "levi@aug.co"
      "Keara Mascareñas": "Keara Mascarenaz"
      "Melissa Shamis": "melissa@aug.co"
      "Samantha Lozzi": "Sam Lozzi"
      "Purvi Patel": "purvi@aug.co"
      "Michael Burkin": "michaelb@aug.co"
  # Policy caps from the Employment Benefits doc (Aug 2025). Penny pushes back
  # (warns the employee + flags for Purvi) when a submission is over a cap or stale
  # — never a hard block (the policy has exceptions, e.g. international-travel cell
  # costs beyond $100, so the reviewer decides). First matching limit wins, so list
  # specific items before general ones. Amounts in cents.
  policy:
    max_age_days: 90                    # general rule: submit within 90 days of purchase
    limits:
      - name: "Home internet"
        period: "month"
        limit_cents: 5000               # $50/mo
        keywords: ["internet", "wifi", "wi-fi", "broadband", "comcast", "xfinity",
                   "spectrum", "fios", "optimum", "verizon fios"]
      - name: "Cell phone equipment"
        period: "month"
        limit_cents: 5000               # $50/mo ($600/yr) toward hardware
        keywords: ["phone equipment", "phone hardware", "new phone", "iphone",
                   "handset", "device payment", "phone payment"]
      - name: "Cell phone service"
        period: "month"
        limit_cents: 10000              # $100/mo service + data (intl client travel exempt)
        keywords: ["cell", "mobile", "data plan", "phone bill", "phone plan",
                   "at&t", "att", "t-mobile", "tmobile", "sprint", "verizon", "phone"]
      - name: "Work travel (non-billable)"
        period: "month"
        limit_cents: 12700              # $127/mo commuting/rideshare
        coa: "General Travel"
        keywords: ["metrocard", "metro card", "mta", "subway", "commute", "rideshare",
                   "ride share", "uber", "lyft", "taxi", "citi bike", "citibike"]
      - name: "Home office setup"
        period: "one-time (year 1)"
        limit_cents: 100000             # $1,000 one-time
        coa: "Office Supplies (NY & Home)"
        keywords: ["monitor", "keyboard", "mouse", "laptop stand", "headphones",
                   "desk chair", "standing desk", "home office"]
      - name: "Professional development"
        period: "trimester"
        limit_cents: 70000              # $700/trimester
        coa: "Professional Development"
  # Recurring WiFi/cell stipends (Phase 3). Tax caveat: a fixed allowance without
  # substantiation may be taxable — confirm treatment with Purvi/CPA before enabling.
  stipends: []
    # - name: "WiFi / Internet"
    #   employee: "Keara Mascareñas"
    #   amount_cents: 7500
    #   coa_line: "Telephone & Internet"
    #   cadence: "monthly"
    #   receipt_required: false

# Event windows encode calendar context the card feed can't carry: during an
# in-person/Summit week or a launch push, ordinary food/travel/local spend is
# coded to the event, not to Groceries/Travel. Supplied prospectively by the
# reviewer each month (ask Purvi/Erica for the month's in-person weeks before
# a pre-fill run). A window only overrides categories in its `absorbs` list, so
# software renewals, subscriptions, etc. that fall in the window are untouched.
# `recur: fridays` marks a standing weekly pattern rather than a date range.
event_windows:
  - name: "May Summit / In-Person Week"
    start: "2026-05-04"
    end: "2026-05-09"
    coa_line: "Team Culture:Summit & In Person Weeks"
    absorbs: ["Groceries & Meals", "General Travel", "Billable Expense",
              "Sales - Client Engagement & Lead Development", "Non-billable Expenses",
              "Sales, Speaking & Conferences"]
  - name: "Friday team lunch"
    recur: "fridays"
    coa_line: "Team Culture:Friday Lunch"
    absorbs: ["Groceries & Meals"]
    # Recurring lunch is NY-office food only; keep it low-confidence so the
    # reviewer confirms (a Friday client dinner shouldn't silently convert).
    confidence: "medium"
