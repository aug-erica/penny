    U094TAG23: "Mike Arauz"
    UDFF86K8V: "Alexis Black"
    U07LMGXF9L0: "Samantha Lozzi"
    U02SCKJR170: "Levi Baer"
    U09CC07JF6D: "Michael Burkin"
    U0235R0PGFL: "Tirzah Enumah"
    U4721P5AQ: "Karina Mangu-Ward"
    U0AGMQ2KW: "Jessie Punia"
    U09MANP29UP: "Purvi Patel"
    U094H9WBE: "Erica Seldin"
