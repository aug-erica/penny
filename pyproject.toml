[project]
name = "cfo-agent"
version = "0.1.0"
description = "Expense Close Agent — agent drafts, human approves. August x Skyfin."
requires-python = ">=3.9"
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
cfo = "cfo_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
